name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx @cap-js/cds-typer "*" --outputDirectory @cds-models
      - run: npx oxlint
      - run: npx prettier --check .
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: cd test/test-app && npm install
      - run: npx @cap-js/cds-typer "*" --outputDirectory @cds-models
      - run: npm test

  test-app-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: cd test/test-app && npm install
      - run: npx @cap-js/cds-typer "*" --outputDirectory @cds-models
      - run: npx tsc
      - name: Verify test app boots and plugin registers handlers
        run: |
          cd test/test-app
          npx cds serve --port 0 &
          PID=$!
          sleep 5
          kill $PID
